{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modificar Post-it</title>
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body>

    <h1>✏️ Modificar Post-it</h1>

    <div class="formulario-contenedor">
        <form method="POST">
            {% csrf_token %}
            
            <div class="campo-grupo">
                <label for="titulo">Tarea / Título:</label>
                <input type="text" id="titulo" name="titulo" required value="{{ tarea.titulo }}">
            </div>

            {# NUEVO SELECTOR PARA REASIGNAR #}
            <div class="campo-grupo">
                <label for="usuario_asignado">Reasignar a:</label>
                <select id="usuario_asignado" name="usuario_asignado">
                    {% for u in usuarios %}
                        <option value="{{ u.id }}" {% if u.id == tarea.asignado_a.id %}selected{% endif %}>
                            {{ u.username }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="campo-grupo">
                <label for="contenido">Descripción:</label>
                <textarea id="contenido" name="contenido" rows="4">{{ tarea.contenido }}</textarea>
            </div>

            <div class="campo-grupo">
                <label for="color">Color del Post-it:</label>
                <select id="color" name="color">
                    <option value="#fff740" {% if tarea.color == "#fff740" %}selected{% endif %}>Amarillo</option>
                    <option value="#ff7eb9" {% if tarea.color == "#ff7eb9" %}selected{% endif %}>Rosa</option>
                    <option value="#7afcff" {% if tarea.color == "#7afcff" %}selected{% endif %}>Azul</option>
                    <option value="#98ff98" {% if tarea.color == "#98ff98" %}selected{% endif %}>Verde</option>
                </select>
            </div>

            <button type="submit" class="btn-guardar">Guardar Cambios</button>
            <a href="{% url 'pizarra' %}" style="display: block; text-align: center; margin-top: 15px; color: #aaa; text-decoration: none;">Cancelar</a>
        </form>
    </div>

</body>
</html>
